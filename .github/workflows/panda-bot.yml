name: Panda Extension Review Bot

on:
  issues:
    types: [opened]

jobs:
  review_and_publish:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '[Extensión]')
    steps:
      - name: Generar Token de Panda App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PANDA_APP_ID }}
          private-key: ${{ secrets.PANDA_APP_PEM }}

      - name: Revisar y Publicar Extensión
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const issueBody = context.payload.issue.body;
            
            const jsonMatch = issueBody.match(/```json\s+([\s\S]*?)\s+```/);
            
            if (!jsonMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                body: "❌ **Error del Bot:** No he encontrado un código JSON válido en tu petición. Por favor, asegúrate de poner el código dentro del bloque ```json ... ```."
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
              return;
            }

            try {
              const extension = JSON.parse(jsonMatch[1]);
              const extString = JSON.stringify(extension).toLowerCase();
              let errors = [];
              
              const badWords = ["puta", "mierda", "joder", "idiota", "porno", "sex", "ads", "anuncio"];
              if (badWords.some(word => extString.includes(word))) {
                errors.push("- Contiene lenguaje, contenido inapropiado o anuncios.");
              }

              if (extension.permisos && extension.permisos.includes("nav bar")) {
                if (/\b(ia|ai|chatgpt)\b/.test(extString)) {
                  errors.push("- Las extensiones en la Nav Bar no pueden ser IAs.");
                }
              }

              if (extension.inajustes) {
                if (extString.includes("login") || extString.includes("auth") || extString.includes("password")) {
                  errors.push("- No se permite crear sistemas de cuentas propios en los ajustes.");
                }
              }

              if (extString.includes("fetch(") || extString.includes("xmlhttprequest")) {
                errors.push("- No se permite robar o enviar datos a servidores externos (fetch bloqueado).");
              }

              if (errors.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                  body: "🚨 **Extensión Rechazada:**\nEl Bot de Panda ha detectado que tu extensión incumple las siguientes normas:\n" + errors.join("\n") + "\n\nCorrige el código y vuelve a enviarlo."
                });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
                return;
              }

              const extId = 'ext_' + Date.now();
              const firebaseDbUrl = "https://erikaccount-db-default-rtdb.europe-west1.firebasedatabase.app/panda_extensions/" + extId + ".json";
              const firebaseUrlWithAuth = `${firebaseDbUrl}?auth=${process.env.FIREBASE_SECRET}`;

              const response = await fetch(firebaseUrlWithAuth, {
                method: 'PUT',
                body: JSON.stringify(extension)
              });

              if(response.ok) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                  body: "✅ **¡Extensión Aprobada y Publicada!**\n\nTu extensión **" + extension.name + "** ha pasado todos los controles de seguridad y acaba de ser añadida a la Tienda Panda. ¡Todos los usuarios ya pueden instalarla!"
                });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', labels: ['publicado'] });
              } else {
                throw new Error("No se pudo subir a Firebase.");
              }

            } catch (err) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                body: "❌ **Error JSON/Sistema:** El código que has enviado no tiene un formato JSON válido o hubo un error al conectar con Firebase. Revisa que el JSON esté bien escrito."
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
            }
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
