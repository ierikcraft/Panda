name: 🧩 Publicar Nueva Extensión para Panda
description: Envía tu extensión JSON para que el Bot la revise y la publique en la Tienda.
title: "[Extensión]: <Nombre de tu extensión>"
labels: ["extension", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## ¡Bienvenido a la Tienda Panda! 🐼
        Por favor, rellena este formulario con el código de tu extensión. Nuestro bot la revisará en segundos.
  - type: input
    id: autor
    attributes:
      label: Autor
      placeholder: Tu nombre o alias (ej. Erik)
    validations:
      required: true
  - type: textarea
    id: json_code
    attributes:
      label: Código de la Extensión (extension.json)
      description: Pega aquí todo tu código JSON. Asegúrate de haberlo probado antes en el Modo Desarrollador de Panda.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Aceptación de Normas de Panda
      description: Si mientes en estas casillas, el Bot de Seguridad rechazará tu extensión.
      options:
        - label: Confirmo que si es un botón de Nav Bar, NO es una IA.
          required: true
        - label: Confirmo que si es de Ajustes, NO incluyo un sistema de cuentas de terceros.
          required: true
        - label: Confirmo que el código NO roba ni envía datos del usuario a servidores externos.
          required: true
        - label: Confirmo que NO incluye palabras malsonantes, anuncios, ni contenido inadecuado.
          required: true
