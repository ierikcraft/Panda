<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErikBrowser (Versión 2)</title>
    <!-- Cargamos Tailwind CSS para un diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Usamos Inter como fuente principal */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Evita el scrollbar principal */
        }
        /* Estilo para la barra de direcciones deshabilitada mientras carga */
        #address-bar:disabled {
            background-color: #f3f4f6;
        }
        /* Estilos para que el contenido principal se encoja */
        #main-container {
            transition: margin-right 0.3s ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-gray-100">

    <!-- 1. Contenedor del Navegador -->
    <div id="main-container" class="h-full flex flex-col">
        <!-- Barra de navegación (el "chrome" del navegador) -->
        <header class="bg-white shadow-md p-2 flex items-center space-x-2 z-10 flex-shrink-0">
            <!-- Botones de navegación -->
            <button id="back-btn" title="Atrás" class="p-2 rounded-full hover:bg-gray-200 text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="forward-btn" title="Adelante" class="p-2 rounded-full hover:bg-gray-200 text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <button id="reload-btn" title="Recargar" class="p-2 rounded-full hover:bg-gray-200 text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m-15.357-2A8.001 8.001 0 0019.418 15m0 0H15" />
                </svg>
            </button>
            <button id="home-btn" title="Inicio (ErikSearch)" class="p-2 rounded-full hover:bg-gray-200 text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6-4a1 1 0 001-1v-1a1 1 0 10-2 0v1a1 1 0 001 1z" />
                </svg>
            </button>
            
            <!-- ¡NUEVO! Botón para abrir ErikAI (AÑADIDO) -->
            <button id="ai-btn" title="Abrir ErikAI" class="p-2 rounded-full hover:bg-gray-200 text-blue-600">
                <img src="https://cdn.glitch.global/647fd858-f0a6-4652-b1c7-40ab5ea1e6bc/erik-ia-animation-more-visual-unscreen.gif?v=1744748575452" alt="ErikAI" class="h-5 w-5">
            </button>

            <!-- Barra de direcciones -->
            <div class="flex-grow relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input 
                    type="text" 
                    id="address-bar" 
                    placeholder="Busca en ErikSearch o escribe una URL" 
                    class="w-full bg-gray-100 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                >
            </div>
        </header>

        <!-- Área de contenido (la página web) -->
        <main class="flex-grow bg-white">
            <iframe 
                id="browser-view" 
                src="https://eriksearch.vercel.app/" 
                class="w-full h-full border-0"
                sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-pointer-lock"
            ></iframe>
        </main>
    </div>

    <!-- 2. ¡NUEVO! Panel Lateral de AI (AÑADIDO) -->
    <div id="ai-sidebar" class="fixed top-0 right-0 h-full w-96 bg-white shadow-lg z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-gray-200">
        <!-- Encabezado de la barra lateral -->
        <div class="p-2 flex justify-between items-center bg-gray-50 border-b" style="height: 56px;">
            <h2 class="text-sm font-semibold text-gray-700 ml-2">ErikAI</h2>
            <button id="close-ai-btn" title="Cerrar" class="p-2 rounded-full hover:bg-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <!-- Contenido de la IA -->
        <iframe 
            id="ai-view" 
            src="https://erikai.vercel.app/mobile.html"
            class="w-full border-0"
            style="height: calc(100% - 56px);"
        ></iframe>
    </div>

    <script>
        // --- Elementos del Navegador ---
        const addressBar = document.getElementById('address-bar');
        const browserView = document.getElementById('browser-view');
        const backBtn = document.getElementById('back-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const homeBtn = document.getElementById('home-btn');

        // --- Elementos de la IA (AÑADIDOS) ---
        const aiBtn = document.getElementById('ai-btn');
        const closeAiBtn = document.getElementById('close-ai-btn');
        const aiSidebar = document.getElementById('ai-sidebar');
        const mainContainer = document.getElementById('main-container');

        // --- URLs ---
        const homeUrl = 'https://eriksearch.vercel.app/';
        // ¡CAMBIO IMPORTANTE! Uso la URL de búsqueda que me diste
        const searchUrlBase = 'https://eriksearch.vercel.app/?q=';

        // --- Lógica de la Barra Lateral de IA (AÑADIDA) ---
        function toggleAiSidebar() {
            aiSidebar.classList.toggle('translate-x-full');
            mainContainer.classList.toggle('mr-96'); // w-96 = 384px
        }
        aiBtn.addEventListener('click', toggleAiSidebar);
        closeAiBtn.addEventListener('click', toggleAiSidebar);

        // --- Lógica del Navegador (de tu versión) ---
        function loadUrl(url) {
            if (!url) return;
            browserView.src = url;
            addressBar.value = url;
        }

        function search(term) {
            if (!term) return;
            const url = searchUrlBase + encodeURIComponent(term);
            loadUrl(url);
        }

        function normalizeUrl(url) {
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return url;
            }
            return 'https://' + url;
        }

        function isUrl(text) {
            return text.includes('.') && !text.includes(' ');
        }

        // --- Event Listeners ---
        addressBar.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const text = addressBar.value.trim();
                if (isUrl(text)) {
                    loadUrl(normalizeUrl(text));
                } else {
                    search(text);
                }
                addressBar.blur();
            }
        });

        homeBtn.addEventListener('click', () => {
            loadUrl(homeUrl);
        });

        reloadBtn.addEventListener('click', () => {
            browserView.src = browserView.src;
        });

        // --- ADVERTENCIA SOBRE IFRAME ---
        // Este código para 'Atrás' y 'Adelante'
        // fallará en cuanto navegues a un dominio diferente
        // (como google.com) por razones de seguridad.
        backBtn.addEventListener('click', () => {
            try {
                browserView.contentWindow.history.back();
            } catch (e) {
                console.warn('Bloqueo de seguridad: No se puede ir atrás en un iframe de origen cruzado.', e);
            }
        });

        forwardBtn.addEventListener('click', () => {
            try {
                browserView.contentWindow.history.forward();
            } catch (e)
                {
                console.warn('Bloqueo de seguridad: No se puede ir adelante en un iframe de origen cruzado.', e);
            }
        });

        // Eventos de Carga (Limitados)
        browserView.addEventListener('loadstart', () => {
            addressBar.disabled = true;
        });
        
        browserView.addEventListener('load', () => {
             addressBar.disabled = false;
        });

        // Carga la página de inicio al abrir
        loadUrl(homeUrl);
    </script>
</body>
</html>
